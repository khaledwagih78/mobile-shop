# Supabase CLI config — خالد لصيانة المحمول
# التشغيل المحلي الكامل (يحتاج Docker):  supabase start
project_id = "khaled-mobile-repair"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "kmr://auth"]
jwt_expiry = 3600
enable_signup = true

# طريقة 1: موبايل + كلمة سر (Supabase بيستخدم إيميل داخلي مشتق من الرقم، مفيش رسايل بتتبعت)
# طريقة 2: إيميل حقيقي + كود 6 أرقام
[auth.email]
enable_signup = true
enable_confirmations = false   # لازم OFF: حسابات الموبايل إيميلها داخلي ومش بيستقبل رسايل
double_confirm_changes = true
otp_length = 6
otp_expiry = 600               # 10 دقائق
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "كود الدخول — خالد لصيانة المحمول"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.confirmation]
subject = "كود الدخول — خالد لصيانة المحمول"
content_path = "./supabase/templates/otp_code.html"

# الإنتاج: SMTP خاص (Brevo / Gmail App Password) — القيم في Dashboard مش هنا
# [auth.email.smtp]
# host = "smtp-relay.brevo.com"
# port = 587
# user = "..."
# pass = "env(SMTP_PASS)"
# admin_email = "no-reply@your-domain"
# sender_name = "خالد لصيانة المحمول"

[auth.sms]
enable_signup = false          # مش بنستخدم SMS
