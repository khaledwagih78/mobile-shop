<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>متابعة حالة الصيانة</title>
  <meta name="description" content="تابع حالة صيانة جهازك" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#F4F6F8; --card:#fff; --ink:#15232B; --muted:#6B7C86;
      --line:#E4E9EC; --brand:#0F4C5C; --brand-2:#13697E;
      --accent:#E07A3F; --ok:#1E8E5A; --red:#C0392B; --chip:#EAF1F3;
      --shadow:0 1px 3px rgba(15,76,92,.08); --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:'Cairo',system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    header.top{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:20px 16px;box-shadow:0 2px 10px rgba(15,76,92,.18)}
    .wrap{max-width:560px;margin:0 auto;padding:0 16px}
    .shopname{font-size:20px;font-weight:800;margin:0}
    .tagline{font-size:13px;opacity:.9;margin:3px 0 0}
    main{max-width:560px;margin:18px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
    .ordno{font-size:13px;color:var(--muted)}
    .ordno b{color:var(--ink);font-size:16px}
    .device{margin-top:4px;font-size:14px}
    .state{display:inline-block;margin-top:12px;font-weight:800;font-size:15px;border-radius:10px;padding:8px 14px}
    .state.active{background:var(--chip);color:var(--brand)}
    .state.ready{background:#E6F6EE;color:var(--ok)}
    .state.cancel{background:#FCE9E7;color:var(--red)}
    /* timeline */
    .tl{list-style:none;margin:16px 0 0;padding:0}
    .tl li{position:relative;padding:0 34px 20px 0;min-height:34px}
    .tl li:last-child{padding-bottom:0}
    .tl li::before{content:'';position:absolute;inset-inline-start:11px;top:22px;bottom:-4px;width:2px;background:var(--line)}
    .tl li:last-child::before{display:none}
    .dot{position:absolute;inset-inline-start:2px;top:1px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
    .tl li.done .dot{background:var(--ok);border-color:var(--ok)}
    .tl li.cur .dot{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--chip)}
    .tl .lbl{font-weight:700;font-size:15px}
    .tl li.todo .lbl{color:var(--muted);font-weight:600}
    .tl .date{font-size:12px;color:var(--muted);margin-top:2px}
    .msg{text-align:center;padding:30px 10px;color:var(--muted)}
    .msg h2{color:var(--ink);margin:0 0 6px}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
    .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <h1 class="shopname" id="shopName">متابعة الصيانة</h1>
    <p class="tagline">تابع حالة صيانة جهازك</p>
  </div></header>

  <main id="app"><div class="spin"></div></main>
  <footer id="foot"></footer>

  <script>
    /* ========================= الإعدادات ========================= */
    const CFG = {
      // اسم المحل اللي هيظهر فوق
      SHOP_NAME: 'مركز الصيانة',

      // بيانات مشروع Supabase بتاعك (نفس بيانات صفحة قائمة الأسعار):
      // Supabase Dashboard -> Project Settings -> API
      SUPABASE_URL:      'https://your-project-id.supabase.co',
      SUPABASE_ANON_KEY: 'your-anon-publishable-key',
    };
    /* ============================================================ */

    const STAGES = [
      { key:'received',    label:'تم استلام الجهاز' },
      { key:'in_progress', label:'تحت الصيانة' },
      { key:'done',        label:'تم الإصلاح — جاهز للاستلام' },
      { key:'delivered',   label:'تم التسليم' },
    ];
    const order = { received:0, in_progress:1, done:2, delivered:3 };

    const $ = (id) => document.getElementById(id);
    document.getElementById('shopName').textContent = CFG.SHOP_NAME;

    function fmtDate(iso){
      if(!iso) return '';
      try{
        return new Date(iso).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})
          + ' - ' + new Date(iso).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
      }catch{ return ''; }
    }
    function token(){
      const q = new URLSearchParams(location.search).get('t');
      if(q) return q.trim();
      return (location.hash||'').replace(/^#/,'').trim();
    }

    function showMsg(title, sub){
      $('app').innerHTML = '<div class="card msg"><h2>'+title+'</h2><div>'+(sub||'')+'</div></div>';
    }

    function render(row){
      const cancelled = row.status === 'cancelled';
      const cur = order[row.status] ?? 0;
      const stamps = row.stamps || {};

      let head = '<div class="card">'
        + '<div class="ordno">رقم الطلب: <b>'+(row.number||'—')+'</b></div>'
        + (row.device ? '<div class="device">الجهاز: '+row.device+'</div>' : '');

      if(cancelled){
        head += '<div class="state cancel">تم إلغاء الطلب</div></div>';
        $('app').innerHTML = head;
        return;
      }

      const stateCls = row.status==='done' ? 'ready' : (row.status==='delivered' ? 'ready' : 'active');
      const stateLabel = STAGES[cur] ? STAGES[cur].label : '';
      head += '<div class="state '+stateCls+'">'+(row.status==='done'?'✅ ':'')+stateLabel+'</div>';

      let tl = '<ul class="tl">';
      STAGES.forEach((st, i) => {
        const cls = i < cur ? 'done' : (i === cur ? 'cur' : 'todo');
        const mark = i < cur ? '✓' : (i === cur ? '●' : '');
        const d = stamps[st.key] ? '<div class="date">'+fmtDate(stamps[st.key])+'</div>' : '';
        tl += '<li class="'+cls+'"><span class="dot">'+mark+'</span>'
            + '<div class="lbl">'+st.label+'</div>'+d+'</li>';
      });
      tl += '</ul>';

      $('app').innerHTML = head + tl + '</div>';
    }

    async function load(){
      const t = token();
      if(!t){ showMsg('رابط غير صالح','تأكد من فتح الرابط كاملاً كما وصلك.'); return; }
      if(CFG.SUPABASE_URL.includes('your-project-id')){
        showMsg('لم يتم الإعداد بعد','يرجى ضبط بيانات Supabase في صفحة التتبّع.'); return;
      }
      try{
        const res = await fetch(CFG.SUPABASE_URL.replace(/\/+$/,'') + '/rest/v1/rpc/repair_status', {
          method:'POST',
          headers:{
            'apikey': CFG.SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + CFG.SUPABASE_ANON_KEY,
            'Content-Type':'application/json',
          },
          body: JSON.stringify({ p_token: t }),
        });
        if(!res.ok) throw new Error('http '+res.status);
        const rows = await res.json();
        const row = Array.isArray(rows) ? rows[0] : rows;
        if(!row || !row.status){ showMsg('لم يتم العثور على الطلب','تأكد من الرابط أو تواصل مع المحل.'); return; }
        render(row);
      }catch(e){
        showMsg('تعذّر تحميل الحالة','تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
      }
    }
    load();
  </script>
</body>
</html>
